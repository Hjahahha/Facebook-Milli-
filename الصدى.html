<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>الصدى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#10131a;
    --card:#1a1f29;
    --card-2:#212734;
    --parchment:#ece6d8;
    --muted:#8b93a6;
    --gold:#e3a542;
    --gold-dim:#5c4a29;
    --teal:#4fa79a;
    --teal-dim:#243d3a;
    --rust:#c9634f;
    --line:#2b3140;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--parchment);
    font-family:'Cairo',sans-serif;
    min-height:100vh;
    padding:28px 16px 60px;
  }
  .wrap{max-width:560px;margin:0 auto;}

  .brand{
    text-align:center;
    margin-bottom:6px;
  }
  .brand h1{
    font-family:'Amiri',serif;
    font-size:44px;
    font-weight:700;
    margin:0;
    letter-spacing:1px;
    color:var(--parchment);
  }
  .brand p{
    font-size:13.5px;
    color:var(--muted);
    margin:6px 0 0;
  }

  /* River strip */
  .river{
    position:relative;
    height:86px;
    margin:26px 0 22px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    overflow:hidden;
  }
  .river-label{
    position:absolute;
    top:6px;
    right:12px;
    font-size:10.5px;
    color:var(--muted);
    letter-spacing:.5px;
    z-index:2;
  }
  .bubble{
    position:absolute;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold), var(--gold-dim));
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#3a2b0f;
    font-size:10px;
    font-weight:600;
    box-shadow:0 0 0 1px rgba(0,0,0,.15) inset;
    animation:drift linear infinite;
  }
  .bubble.teal{
    background:radial-gradient(circle at 35% 30%, var(--teal), var(--teal-dim));
    color:#0c2523;
  }
  @keyframes drift{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-6px);}
    100%{transform:translateY(0px);}
  }

  /* Card */
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:16px;
    padding:20px;
    margin-bottom:16px;
  }
  .eyebrow{
    font-size:11.5px;
    color:var(--gold);
    font-weight:600;
    letter-spacing:.3px;
    margin:0 0 10px;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .whisper-text{
    font-family:'Amiri',serif;
    font-size:19px;
    line-height:1.9;
    color:var(--parchment);
    margin:0 0 16px;
  }
  .who{
    font-size:12px;
    color:var(--muted);
    margin:-10px 0 16px;
  }

  textarea{
    width:100%;
    min-height:86px;
    background:var(--card-2);
    border:1px solid var(--line);
    border-radius:12px;
    color:var(--parchment);
    font-family:'Cairo',sans-serif;
    font-size:14.5px;
    padding:12px 14px;
    resize:none;
    outline:none;
  }
  textarea::placeholder{color:var(--muted);}
  textarea:focus{border-color:var(--gold);}

  .row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
  }
  .hint{font-size:11.5px;color:var(--muted);}

  button{
    font-family:'Cairo',sans-serif;
    border:none;
    border-radius:10px;
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:opacity .15s;
  }
  button:disabled{opacity:.35;cursor:not-allowed;}
  .btn-gold{background:var(--gold);color:#2c2004;}
  .btn-teal{background:var(--teal);color:#092220;}
  button:not(:disabled):hover{opacity:.88;}

  .locked{
    position:relative;
    filter:blur(2px) grayscale(.4);
    pointer-events:none;
    user-select:none;
  }
  .lock-overlay{
    text-align:center;
    padding:22px 16px;
    color:var(--muted);
    font-size:13.5px;
  }
  .lock-overlay i{display:block;font-size:22px;margin-bottom:8px;color:var(--gold);}

  .toast{
    position:fixed;
    bottom:22px;
    left:50%;
    transform:translateX(-50%) translateY(10px);
    background:var(--teal);
    color:#092220;
    padding:12px 20px;
    border-radius:12px;
    font-size:13.5px;
    font-weight:600;
    opacity:0;
    transition:all .35s;
    max-width:90%;
    text-align:center;
    z-index:10;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .rule{
    text-align:center;
    font-family:'Amiri',serif;
    font-size:15px;
    color:var(--muted);
    margin:30px 0 4px;
    line-height:1.8;
  }
  .rule b{color:var(--gold);font-weight:700;}

  .journey-tag{
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-size:11px;
    color:var(--muted);
    background:var(--card-2);
    border:1px solid var(--line);
    padding:4px 10px;
    border-radius:20px;
    margin-top:2px;
  }
  .journey-tag b{color:var(--gold);}
</style>
</head>
<body>
<div class="wrap">

  <div class="brand">
    <h1>الصدى</h1>
    <p>لا متابعون. لا إعجابات. فقط أصداء تسافر.</p>
  </div>

  <div class="river">
    <div class="river-label">النهر الجمعي</div>
    <div id="riverInner" style="position:relative;width:100%;height:100%;"></div>
  </div>

  <div id="listenStage" class="card">
    <p class="eyebrow"><span>◐</span> اسمع أولاً</p>
    <p class="who">صوت غريب، بلا اسم</p>
    <p class="whisper-text" id="listenText"></p>
    <textarea id="replyBox" placeholder="اكتب ردًا صادقًا... لن يصلك صوتك إلا بعد أن تصغي"></textarea>
    <div class="row">
      <span class="hint" id="replyHint">10 أحرف على الأقل</span>
      <button class="btn-teal" id="sendReply" disabled>أرسل الإصغاء</button>
    </div>
  </div>

  <div id="speakStage" class="card locked">
    <p class="eyebrow"><span>◑</span> الآن صوتك</p>
    <textarea id="whisperBox" placeholder="اكتب خاطرتك هنا... ستنطلق عبر النهر بقدر ما يصغي إليها الآخرون"></textarea>
    <div class="row">
      <span class="hint" id="whisperHint">لن تُنشر حتى تصغي أولاً</span>
      <button class="btn-gold" id="sendWhisper" disabled>أطلق الصدى</button>
    </div>
  </div>

  <p class="rule">صوتك <b>لا ينتشر</b> إلا حين يصغي إلى غيره أولاً،<br>وانتشاره يُقاس بمن استجاب له، لا بمن أعجبه.</p>

</div>

<div class="toast" id="toast"></div>

<script>
const pool = [
  "أشعر أني أضع كل جهدي في مكان لا أحد يراه فيه.",
  "كل ليلة أؤجل شيئًا أعرف أنه سيريحني لو فعلته الآن.",
  "أخاف أن أطلب المساعدة لأن ذلك يبدو ضعفًا في عيني.",
  "أحيانًا أضحك بصوت عالٍ لأخفي أني تعبت من الابتسام.",
  "لم أعد أعرف إن كنت أحب عملي أم فقط اعتدته.",
  "أشتاق لشخص كنت أظن أنه سيبقى للأبد.",
  "أكتب هذا لأن لا أحد حولي يسأل كيف حالي فعلاً.",
  "أشعر بالفخر لأني استمررت رغم كل ما مررت به هذا الشهر."
];
const names = ["مجهول ١٩", "صوت عابر", "غريب لطيف", "همسة ٧", "بلا اسم", "مسافر صامت"];

let state = {
  respondedFirst: false,
  myWhispers: [],
  poolIdx: Math.floor(Math.random()*pool.length),
};

const listenText = document.getElementById('listenText');
const listenWho = document.querySelector('.who');
const replyBox = document.getElementById('replyBox');
const sendReply = document.getElementById('sendReply');
const speakStage = document.getElementById('speakStage');
const whisperBox = document.getElementById('whisperBox');
const sendWhisper = document.getElementById('sendWhisper');
const river = document.getElementById('riverInner');
const toastEl = document.getElementById('toast');

function pickWhisper(){
  state.poolIdx = Math.floor(Math.random()*pool.length);
  listenText.textContent = pool[state.poolIdx];
  listenWho.textContent = names[Math.floor(Math.random()*names.length)] + "، بلا اسم";
}
pickWhisper();

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 2600);
}

function spawnBubble(text, journey, teal){
  const b = document.createElement('div');
  b.className = 'bubble' + (teal ? ' teal' : '');
  const size = 26 + Math.min(journey, 6) * 6;
  b.style.width = size + 'px';
  b.style.height = size + 'px';
  b.style.left = Math.random()*80 + '%';
  b.style.top = (10 + Math.random()*55) + '%';
  b.style.animationDuration = (3 + Math.random()*3) + 's';
  b.textContent = journey;
  b.title = text;
  b.onclick = () => toast('"' + text.slice(0,40) + (text.length>40?'…':'') + '"  —  رحلة عبر ' + journey + ' شخص');
  river.appendChild(b);
  return b;
}

// seed river with ambient whispers
for(let i=0;i<5;i++){
  spawnBubble(pool[Math.floor(Math.random()*pool.length)], Math.floor(Math.random()*5)+1, false);
}

replyBox.addEventListener('input', ()=>{
  sendReply.disabled = replyBox.value.trim().length < 10;
});

sendReply.addEventListener('click', ()=>{
  state.respondedFirst = true;
  document.getElementById('listenStage').style.display = 'none';
  speakStage.classList.remove('locked');
  document.getElementById('whisperHint').textContent = 'اكتب بصدق. سيراه الآخرون فقط إن أصغوا هم أيضًا';
  toast('وصل إصغاؤك لصاحب الخاطرة. الآن دورك.');
});

whisperBox.addEventListener('input', ()=>{
  sendWhisper.disabled = whisperBox.value.trim().length < 6;
});

sendWhisper.addEventListener('click', ()=>{
  const text = whisperBox.value.trim();
  const bubble = spawnBubble(text, 0, true);
  state.myWhispers.push({text, journey:0, el:bubble});
  whisperBox.value = '';
  sendWhisper.disabled = true;
  toast('انطلق صداك في النهر. بانتظار من يصغي إليه.');

  // simulate organic listeners responding over time
  let ticks = 0;
  const timer = setInterval(()=>{
    ticks++;
    const w = state.myWhispers[state.myWhispers.length-1];
    w.journey++;
    w.el.textContent = w.journey;
    w.el.style.width = (26 + Math.min(w.journey,6)*6) + 'px';
    w.el.style.height = w.el.style.width;
    if(w.journey === 2){
      toast('شخصان أصغيا إلى صداك حتى الآن.');
    }
    if(w.journey === 4){
      toast('خيط اتصال جديد فُتح مع "همسة ٧" — تبادلتما الإصغاء مرتين.');
      clearInterval(timer);
    }
    if(ticks > 6){ clearInterval(timer); }
  }, 2600);

  // reset the listening stage for another round
  setTimeout(()=>{
    document.getElementById('listenStage').style.display = 'block';
    speakStage.classList.add('locked');
    replyBox.value = '';
    sendReply.disabled = true;
    pickWhisper();
  }, 900);
});
</script>
</body>
</html>
