{% extends 'base.html' %}

{% block title %}تعديل المستخدم - Ishtar Portal{% endblock %}

{% block content %}
<div class="main-content">
    <div class="page-header">
        <h1><i class="bi bi-person-check"></i> تعديل المستخدم</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">الاسم</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ user.name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="role" class="form-label">الدور</label>
                                <select class="form-select" id="role" name="role" required>
                                    <option value="customer" {% if user.role == 'customer' %}selected{% endif %}>مشتري</option>
                                    <option value="merchant" {% if user.role == 'merchant' %}selected{% endif %}>تاجر</option>
                                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>إدارة</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="is_active" class="form-label">الحالة</label>
                                <div class="form-check mt-2">
                                    <input class="form-check-input" type="checkbox" id="is_active" name="is_active" {% if user.is_active %}checked{% endif %}>
                                    <label class="form-check-label" for="is_active">
                                        المستخدم نشط
                                    </label>
                                </div>
                            </div>
                        </div>

                        <div class="alert alert-info" role="alert">
                            <i class="bi bi-info-circle"></i>
                            <strong>معلومات إضافية:</strong>
                            <ul class="mb-0 mt-2">
                                <li>الهاتف: {{ user.phone }}</li>
                                <li>تاريخ التسجيل: {{ user.created_at.strftime('%d/%m/%Y %H:%M') }}</li>
                            </ul>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> حفظ التغييرات
                            </button>
                            <a href="{{ url_for('admin_users') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
