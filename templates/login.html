{% extends 'base.html' %}

{% block title %}تسجيل الدخول - Ishtar Portal{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4"><i class="bi bi-lock"></i> تسجيل الدخول</h2>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label for="phone" class="form-label">رقم الهاتف</label>
                            <input type="tel" class="form-control" id="phone" name="phone" placeholder="07xxxxxxxx" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">كلمة المرور</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label" for="remember">
                                تذكرني
                            </label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-box-arrow-in-right"></i> تسجيل الدخول
                        </button>
                    </form>
                    
                    <hr>
                    
                    <p class="text-center mb-0">
                        ليس لديك حساب؟ <a href="{{ url_for('register') }}">أنشئ حسابا جديدا</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
