{% extends 'base.html' %}

{% block title %}التسجيل - Ishtar Portal{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card">
                <div class="card-body p-5">
                    <h2 class="text-center mb-4"><i class="bi bi-person-plus"></i> إنشاء حساب جديد</h2>
                    
                    <form method="POST">
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="name" class="form-label">الاسم الكامل</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="phone" class="form-label">رقم الهاتف</label>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="07xxxxxxxx" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">البريد الإلكتروني</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="password" class="form-label">كلمة المرور</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                                <small class="text-muted">يجب أن تكون أطول من 6 أحرف</small>
                            </div>
                            
                            <div class="col-md-6 mb-3">
                                <label for="confirm_password" class="form-label">تأكيد كلمة المرور</label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                            </div>
                        </div>
                        
                        <div class="mb-4">
                            <label for="role" class="form-label">نوع الحساب</label>
                            <select class="form-select" id="role" name="role" required>
                                <option value="customer">مشتري عادي</option>
                                <option value="merchant">تاجر</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 mb-3">
                            <i class="bi bi-check-circle"></i> إنشاء الحساب
                        </button>
                    </form>
                    
                    <hr>
                    
                    <p class="text-center mb-0">
                        هل لديك حساب بالفعل؟ <a href="{{ url_for('login') }}">سجل الدخول</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
