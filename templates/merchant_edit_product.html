{% extends 'base.html' %}

{% block title %}تعديل المنتج - Ishtar Portal{% endblock %}

{% block content %}
<div class="main-content">
    <div class="page-header">
        <h1><i class="bi bi-pencil"></i> تعديل المنتج</h1>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body p-4">
                    <form method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">اسم المنتج</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="category" class="form-label">الفئة</label>
                                <input type="text" class="form-control" id="category" name="category" value="{{ product.category }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="status" class="form-label">الحالة</label>
                                <select class="form-select" id="status" name="status">
                                    <option value="active" {% if product.status == 'active' %}selected{% endif %}>نشط</option>
                                    <option value="inactive" {% if product.status == 'inactive' %}selected{% endif %}>غير نشط</option>
                                    <option value="archived" {% if product.status == 'archived' %}selected{% endif %}>أرشيف</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="description" class="form-label">الوصف</label>
                            <textarea class="form-control" id="description" name="description" rows="4">{{ product.description }}</textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">السعر (IQD)</label>
                                <input type="number" class="form-control" id="price" name="price" step="0.01" value="{{ product.price }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="quantity" class="form-label">الكمية المتاحة</label>
                                <input type="number" class="form-control" id="quantity" name="quantity" value="{{ product.quantity }}" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <small class="text-muted">
                                <strong>آخر تحديث:</strong> {{ product.updated_at.strftime('%d/%m/%Y %H:%M') }}
                            </small>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> حفظ التغييرات
                            </button>
                            <a href="{{ url_for('merchant_products') }}" class="btn btn-outline-secondary">
                                <i class="bi bi-x-circle"></i> إلغاء
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
